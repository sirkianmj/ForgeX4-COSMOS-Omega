- id: zlib_inflate_parser
  archetype: parser
  inline_sources:
    harness.c: "#include <zlib.h>\n#include <stdio.h>\n#include <stdlib.h>\nint main(void)\
      \ {\n    unsigned char in[65536];\n    size_t in_len = fread(in, 1, sizeof(in),\
      \ stdin);\n    z_stream strm = {0};\n    if (inflateInit(&strm) != Z_OK) return\
      \ 1;\n    strm.next_in = in; strm.avail_in = (uInt)in_len;\n    size_t out_cap\
      \ = 262144, total = 0;\n    unsigned char *out = malloc(out_cap);\n    int ret;\n\
      \    do {\n        unsigned char tmp[65536];\n        strm.next_out = tmp; strm.avail_out\
      \ = sizeof(tmp);\n        ret = inflate(&strm, Z_NO_FLUSH);\n        if (ret\
      \ < 0 && ret != Z_BUF_ERROR) { inflateEnd(&strm); free(out); return 1; }\n \
      \       size_t got = sizeof(tmp) - strm.avail_out;\n        if (total + got\
      \ > out_cap) {\n            out_cap *= 2;\n            unsigned char *nb = realloc(out,\
      \ out_cap);\n            if (!nb) { inflateEnd(&strm); free(out); return 1;\
      \ }\n            out = nb;\n        }\n        total += got;\n    } while (ret\
      \ != Z_STREAM_END);\n    inflateEnd(&strm); free(out);\n    printf(\"ZLIB_OK:%zu\\\
      n\", total); return 0;\n}\n"
  ldflags:
  - -lz
  benign_probes:
  - name: valid_zlib
    stdin_generator: zlib_benign
    expect_stdout_contains: ZLIB_OK
  attack_probes:
  - name: zip_bomb_128mb
    threat_class: memory_dos
    stdin_generator: zlib_bomb_128mb
