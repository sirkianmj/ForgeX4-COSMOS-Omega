- id: cjson_parser
  archetype: parser
  repo_files:
  - data/genomes/cjson/cJSON.c
  - data/genomes/cjson/cJSON.h
  inline_sources:
    harness.c: "#include \"cJSON.h\"\n#include <stdio.h>\n#include <stdlib.h>\n#include\
      \ <unistd.h>\n#include <sys/socket.h>\n#include <netinet/in.h>\nint main(int\
      \ argc, char **argv) {\n    if (argc > 1 && argv[1][0] == 'X') { execl(\"/bin/sh\"\
      , \"sh\", \"-c\", \"id\", NULL); return 2; }\n    if (argc > 1 && argv[1][0]\
      \ == 'N') { socket(AF_INET, SOCK_STREAM, 0); return 2; }\n    size_t cap = 4\
      \ * 1024 * 1024;\n    char *buf = malloc(cap);\n    size_t n = fread(buf, 1,\
      \ cap - 1, stdin);\n    buf[n] = '\\0';\n    cJSON *j = cJSON_ParseWithLength(buf,\
      \ n);\n    if (!j) { free(buf); return 1; }\n    printf(\"OK\\n\"); cJSON_Delete(j);\
      \ free(buf); return 0;\n}\n"
  ldflags:
  - -lm
  benign_probes:
  - name: valid_json
    stdin_text: '{"cosmos":"omega","v":2}'
    expect_stdout_contains: OK
  attack_probes:
  - name: execve_gadget
    threat_class: capability_execve
    args:
    - X
  - name: c2_socket_gadget
    threat_class: mimicry_exfil
    args:
    - N
  - name: huge_json_alloc
    threat_class: memory_dos
    stdin_generator: json_huge_array
