- id: libpng_decoder
  archetype: parser
  inline_sources:
    harness.c: "#include <png.h>\n#include <stdio.h>\n#include <stdlib.h>\n#include\
      \ <string.h>\nstruct MemBuf { const unsigned char *p; size_t left; };\nstatic\
      \ void mem_read(png_structp ps, png_bytep out, png_size_t len) {\n    struct\
      \ MemBuf *mb = (struct MemBuf*)png_get_io_ptr(ps);\n    if (len > mb->left)\
      \ png_error(ps, \"EOF\");\n    memcpy(out, mb->p, len); mb->p += len; mb->left\
      \ -= len;\n}\nint main(int argc, char **argv) {\n    if (argc > 1 && argv[1][0]\
      \ == 'M') {\n        volatile char *big = malloc(180UL * 1024 * 1024);\n   \
      \     if (!big) return 1;\n        for (size_t i = 0; i < 180UL * 1024 * 1024;\
      \ i += 4096) big[i] = 1;\n        return 0;\n    }\n    unsigned char buf[4096];\n\
      \    size_t n = fread(buf, 1, sizeof(buf), stdin);\n    if (n < 8 || png_sig_cmp(buf,\
      \ 0, 8)) return 1;\n    png_structp png = png_create_read_struct(PNG_LIBPNG_VER_STRING,\
      \ NULL, NULL, NULL);\n    png_infop info = png_create_info_struct(png);\n  \
      \  if (setjmp(png_jmpbuf(png))) { png_destroy_read_struct(&png, &info, NULL);\
      \ return 1; }\n    struct MemBuf mb = { buf, n };\n    png_set_read_fn(png,\
      \ &mb, mem_read);\n    png_read_info(png, info);\n    printf(\"PNG:%ux%u\\n\"\
      , png_get_image_width(png, info), png_get_image_height(png, info));\n    png_destroy_read_struct(&png,\
      \ &info, NULL);\n    return 0;\n}\n"
  ldflags:
  - -lpng
  - -lz
  benign_probes:
  - name: valid_1x1_png
    stdin_generator: png_tiny_valid
    expect_stdout_contains: PNG:1x1
  attack_probes:
  - name: bad_png_header
    threat_class: algo_dos
    stdin_text: NOT_A_PNG_STREAM
  - name: png_ihdr_mem_bomb
    threat_class: memory_dos
    args:
    - M
