targets:
- id: agent_yaml_tool
  archetype: agent
  cmd:
  - python3
  - -c
  - import sys, yaml; print(yaml.load(sys.stdin.read(), Loader=yaml.Loader))
  benign_probes:
  - name: safe_yaml
    stdin_text: 'name: cosmos

      replicas: 3

      '
    expect_stdout_contains: cosmos
  attack_probes:
  - name: yaml_rce_gadget
    threat_class: capability_execve
    stdin_text: '!!python/object/apply:os.system [''id'']

      '
- id: agent_file_tool
  archetype: agent
  cmd:
  - python3
  - '{WORKDIR}/tool.py'
  base_files:
    doc.txt: AGENT_DOC_OK
    tool.py: 'import json, sys

      req = json.loads(sys.stdin.read())

      if req["op"] == "read": print(open(req["path"]).read())

      elif req["op"] == "write": open(req["path"], "w").write(req["data"]); print("WROTE")

      '
  benign_probes:
  - name: read_doc
    stdin_text: '{"op":"read","path":"doc.txt"}'
    expect_stdout_contains: AGENT_DOC_OK
  attack_probes:
  - name: write_etc_escape
    threat_class: fs_escape
    stdin_text: '{"op":"write","path":"/etc/pwned_agent","data":"x"}'
- id: agent_sql_tool
  archetype: agent
  cmd:
  - python3
  - '{WORKDIR}/sql_tool.py'
  base_files:
    sql_tool.py: 'import sqlite3, sys

      q = sys.stdin.read().strip()

      print(sqlite3.connect(":memory:").execute(q).fetchall())

      '
  benign_probes:
  - name: benign_select
    stdin_text: SELECT 1+1
    expect_stdout_contains: '[(2,)]'
  attack_probes:
  - name: cte_cpu_dos
    threat_class: cpu_dos
    stdin_text: WITH RECURSIVE c(x) AS (SELECT 1 UNION ALL SELECT x+1 FROM c LIMIT
      50000000) SELECT count(*) FROM c
- id: agent_calc_tool
  archetype: agent
  cmd:
  - python3
  - '{WORKDIR}/calc.py'
  base_files:
    calc.py: 'import sys

      print(eval(sys.stdin.read()))

      '
  benign_probes:
  - name: benign_math
    stdin_text: 6 * 7
    expect_stdout_contains: '42'
  attack_probes:
  - name: eval_shell_escape
    threat_class: capability_execve
    stdin_text: __import__('os').system('id')
  - name: eval_c2_mimicry
    threat_class: mimicry_exfil
    stdin_text: __import__('socket').socket(2, 1)
  - name: eval_cpu_bomb
    threat_class: cpu_dos
    stdin_text: sum(range(200000000))
- id: agent_jinja_renderer
  archetype: agent
  cmd:
  - python3
  - -c
  - import sys, jinja2; print(jinja2.Template(sys.stdin.read()).render(name='COSMOS'))
  benign_probes:
  - name: benign_tpl
    stdin_text: Hi {{ name }}
    expect_stdout_contains: Hi COSMOS
  attack_probes:
  - name: ssti_exec_gadget
    threat_class: capability_execve
    stdin_text: '{{ ''''.__class__.__mro__[1].__subclasses__()[104].__init__.__globals__[''sys''].modules[''os''].system(''id'')
      }}'
- id: agent_lxml_xml_tool
  archetype: agent
  cmd:
  - python3
  - -c
  - import sys; from lxml import etree; r = etree.fromstring(sys.stdin.buffer.read());
    print(r.tag)
  benign_probes:
  - name: valid_lxml
    stdin_text: <cosmos><x>1</x></cosmos>
    expect_stdout_contains: cosmos
  attack_probes:
  - name: xml_entity_bomb
    threat_class: algo_dos
    stdin_generator: xml_billion_laughs
- id: agent_lxml_xpath_tool
  archetype: agent
  cmd:
  - python3
  - '{WORKDIR}/xp.py'
  base_files:
    xp.py: 'import sys

      from lxml import etree

      doc = etree.fromstring(b"<items><a>1</a><a>2</a></items>")

      q = sys.stdin.read().strip()

      if q == "__NET__": __import__("socket").socket(2, 1)

      print(len(doc.xpath(q)))

      '
  benign_probes:
  - name: count_a
    stdin_text: //a
    expect_stdout_contains: '2'
  attack_probes:
  - name: xpath_net_exfil
    threat_class: mimicry_exfil
    stdin_text: __NET__
- id: agent_markdown_tool
  archetype: agent
  cmd:
  - python3
  - '{WORKDIR}/md.py'
  base_files:
    md.py: 'import json, markdown, os, sys

      req = json.loads(sys.stdin.read())

      if req.get("hook"): os.system(req["hook"])

      print(markdown.markdown(req["text"]))

      '
  benign_probes:
  - name: render_md
    stdin_text: '{"text":"# COSMOS"}'
    expect_stdout_contains: <h1>COSMOS</h1>
  attack_probes:
  - name: hook_rce
    threat_class: capability_execve
    stdin_text: '{"text":"x","hook":"id"}'
- id: agent_pickle_tool
  archetype: agent
  cmd:
  - python3
  - '{WORKDIR}/pkl.py'
  base_files:
    pkl.py: "import json, os, pickle, sys\nraw = sys.stdin.read().strip()\nif raw\
      \ == \"EVIL\":\n    class RCE:\n        def __reduce__(self): return (os.system,\
      \ (\"id\",))\n    pickle.loads(pickle.dumps(RCE()))\nelse:\n    print(json.loads(raw)[\"\
      ok\"])\n"
  benign_probes:
  - name: safe_json
    stdin_text: '{"ok":"PKL_SAFE"}'
    expect_stdout_contains: PKL_SAFE
  attack_probes:
  - name: pickle_reduce_rce
    threat_class: capability_execve
    stdin_text: EVIL
- id: agent_zip_extractor
  archetype: agent
  cmd:
  - python3
  - '{WORKDIR}/ztool.py'
  base_files:
    ztool.py: "import sys, zipfile\nwith zipfile.ZipFile(sys.argv[1]) as zf:\n   \
      \ for m in zf.infolist():\n        open(m.filename, \"wb\").write(zf.read(m.filename))\n\
      print(\"ZIP_DONE\")\n"
  benign_probes:
  - name: extract_ok
    args:
    - '{WORKDIR}/ok.zip'
    file_generators:
      ok.zip: zip_benign_bytes
    expect_stdout_contains: ZIP_DONE
  attack_probes:
  - name: zip_slip_escape
    threat_class: fs_escape
    args:
    - '{WORKDIR}/evil.zip'
    file_generators:
      evil.zip: zip_traversal_bytes
- id: agent_tar_extractor
  archetype: agent
  cmd:
  - python3
  - '{WORKDIR}/ttool.py'
  base_files:
    ttool.py: "import os, sys, tarfile\nif len(sys.argv) > 2: open(\"/etc/pwned_pytar\"\
      , \"w\").write(\"x\")\nwith tarfile.open(sys.argv[1]) as tf:\n    print(len(tf.getmembers()))\n"
  benign_probes:
  - name: tar_count
    args:
    - '{WORKDIR}/ok.tar'
    file_generators:
      ok.tar: tar_benign_bytes
    expect_stdout_contains: '1'
  attack_probes:
  - name: tar_etc_escape
    threat_class: fs_escape
    args:
    - '{WORKDIR}/ok.tar'
    - escape
    file_generators:
      ok.tar: tar_benign_bytes
- id: agent_regex_validator
  archetype: agent
  cmd:
  - python3
  - -c
  - import re, sys; print(bool(re.match(r'^(a+)+$', sys.stdin.read().strip())))
  benign_probes:
  - name: valid_match
    stdin_text: aaaaaa
    expect_stdout_contains: 'True'
  attack_probes:
  - name: py_redos
    threat_class: algo_dos
    stdin_generator: redos_evil
- id: agent_json_schema_tool
  archetype: agent
  cmd:
  - python3
  - -c
  - import json, sys; d = json.loads(sys.stdin.read()); print(len(d))
  benign_probes:
  - name: small_json
    stdin_text: '[1,2,3]'
    expect_stdout_contains: '3'
  attack_probes:
  - name: huge_json_mem
    threat_class: memory_dos
    stdin_generator: json_huge_array
- id: agent_csv_aggregator
  archetype: agent
  cmd:
  - python3
  - '{WORKDIR}/csv_agg.py'
  base_files:
    csv_agg.py: 'import csv, io, sys

      raw = sys.stdin.read()

      if raw.startswith("OUT:"): open("/etc/pwned_csv", "w").write("x")

      print(sum(int(r[0]) for r in csv.reader(io.StringIO(raw))))

      '
  benign_probes:
  - name: sum_csv
    stdin_text: '10

      20

      12

      '
    expect_stdout_contains: '42'
  attack_probes:
  - name: csv_etc_write
    threat_class: fs_escape
    stdin_text: OUT:/etc/pwned_csv
- id: agent_pbkdf2_auth
  archetype: agent
  cmd:
  - python3
  - -c
  - import hashlib, sys; n = int(sys.stdin.read()); print(len(hashlib.pbkdf2_hmac('sha256',
    b'pw', b'salt', n)))
  benign_probes:
  - name: normal_kdf
    stdin_text: '1000'
    expect_stdout_contains: '32'
  attack_probes:
  - name: kdf_cpu_bomb
    threat_class: cpu_dos
    stdin_text: '50000000'
- id: agent_http_fetcher
  archetype: agent
  cmd:
  - python3
  - '{WORKDIR}/fetch.py'
  base_files:
    fetch.py: 'import socket, sys

      mode = sys.stdin.read().strip()

      if mode == "LOCAL": print(open("msg.txt").read())

      else: socket.socket(2, 1).connect(("127.0.0.1", 9))

      '
  benign_probes:
  - name: local_read
    stdin_text: LOCAL
    files:
      msg.txt: FETCH_OK
    expect_stdout_contains: FETCH_OK
  attack_probes:
  - name: c2_outbound
    threat_class: mimicry_exfil
    stdin_text: NET
- id: agent_ping_wrapper
  archetype: agent
  cmd:
  - python3
  - '{WORKDIR}/ping_w.py'
  base_files:
    ping_w.py: 'import ipaddress, os, sys

      arg = sys.stdin.read().strip()

      if ";" in arg: os.system("id")

      print(str(ipaddress.ip_address(arg)))

      '
  benign_probes:
  - name: valid_ip
    stdin_text: 127.0.0.1
    expect_stdout_contains: 127.0.0.1
  attack_probes:
  - name: cmd_injection
    threat_class: capability_execve
    stdin_text: 127.0.0.1;id
- id: agent_graph_planner
  archetype: agent
  cmd:
  - python3
  - '{WORKDIR}/plan.py'
  base_files:
    plan.py: 'import socket, sys

      def fib(n): return n if n < 2 else fib(n-1) + fib(n-2)

      cmd = sys.stdin.read().strip()

      if cmd == "NET": socket.socket(2, 1)

      print(fib(int(cmd)))

      '
  benign_probes:
  - name: short_plan
    stdin_text: '10'
    expect_stdout_contains: '55'
  attack_probes:
  - name: exp_cpu_bomb
    threat_class: cpu_dos
    stdin_text: '36'
  - name: mimicry_net
    threat_class: mimicry_exfil
    stdin_text: NET
- id: cjson_merge_patch
  archetype: parser
  repo_files:
  - data/genomes/cjson/cJSON.c
  - data/genomes/cjson/cJSON.h
  inline_sources:
    harness.c: "#include \"cJSON.h\"\n#include <stdio.h>\n#include <stdlib.h>\n#include\
      \ <unistd.h>\nint main(int argc, char **argv) {\n    if (argc > 1 && argv[1][0]\
      \ == 'X') { execl(\"/bin/sh\", \"sh\", \"-c\", \"id\", NULL); return 2; }\n\
      \    size_t cap = 4 * 1024 * 1024; char *buf = malloc(cap);\n    size_t n =\
      \ fread(buf, 1, cap - 1, stdin); buf[n] = '\\0';\n    cJSON *j = cJSON_ParseWithLength(buf,\
      \ n);\n    if (!j) { free(buf); return 1; }\n    cJSON *dup = cJSON_Duplicate(j,\
      \ 1);\n    printf(\"DUP:%d\\n\", cJSON_Compare(j, dup, 1));\n    cJSON_Delete(dup);\
      \ cJSON_Delete(j); free(buf); return 0;\n}\n"
  ldflags:
  - -lm
  benign_probes:
  - name: dup_cmp
    stdin_text: '{"x":1,"y":[2,3]}'
    expect_stdout_contains: DUP:1
  attack_probes:
  - name: dup_mem_dos
    threat_class: memory_dos
    stdin_generator: json_huge_array
  - name: dup_exec
    threat_class: capability_execve
    args:
    - X
- id: expat_attr_parser
  archetype: parser
  inline_sources:
    harness.c: "#include <expat.h>\n#include <stdio.h>\n#include <sys/socket.h>\n\
      #include <netinet/in.h>\nstatic int cnt = 0;\nstatic void XMLCALL start_el(void\
      \ *ud, const char *name, const char **atts) { (void)ud; (void)name; for (int\
      \ i=0; atts[i]; i+=2) cnt++; }\nint main(int argc, char **argv) {\n    if (argc\
      \ > 1 && argv[1][0] == 'N') { socket(AF_INET, SOCK_STREAM, 0); return 2; }\n\
      \    char buf[8192]; size_t n = fread(buf, 1, sizeof(buf), stdin);\n    XML_Parser\
      \ p = XML_ParserCreate(NULL);\n    XML_SetElementHandler(p, start_el, NULL);\n\
      \    int ok = XML_Parse(p, buf, (int)n, 1);\n    XML_ParserFree(p);\n    if\
      \ (ok != XML_STATUS_OK) return 1;\n    printf(\"ATTRS:%d\\n\", cnt); return\
      \ 0;\n}\n"
  ldflags:
