- id: zlib_gzip_header
  archetype: parser
  inline_sources:
    harness.c: "#include <zlib.h>\n#include <stdio.h>\n#include <stdlib.h>\nint main(void)\
      \ {\n    unsigned char in[65536]; size_t n = fread(in, 1, sizeof(in), stdin);\n\
      \    z_stream s = {0};\n    if (inflateInit2(&s, 16 + MAX_WBITS) != Z_OK) return\
      \ 1;\n    s.next_in = in; s.avail_in = (uInt)n;\n    size_t cap = 262144, tot\
      \ = 0; unsigned char *out = malloc(cap);\n    int ret;\n    do {\n        unsigned\
      \ char tmp[65536]; s.next_out = tmp; s.avail_out = sizeof(tmp);\n        ret\
      \ = inflate(&s, Z_NO_FLUSH);\n        if (ret < 0 && ret != Z_BUF_ERROR) { inflateEnd(&s);\
      \ free(out); return 1; }\n        size_t got = sizeof(tmp) - s.avail_out;\n\
      \        if (tot + got > cap) { cap *= 2; out = realloc(out, cap); if (!out)\
      \ return 1; }\n        tot += got;\n    } while (ret != Z_STREAM_END);\n   \
      \ inflateEnd(&s); free(out); printf(\"GZ:%zu\\n\", tot); return 0;\n}\n"
  ldflags:
  - -lz
  benign_probes:
  - name: valid_gz
    stdin_generator: gzip_benign
    expect_stdout_contains: 'GZ:'
  attack_probes:
  - name: gz_bomb
    threat_class: memory_dos
    stdin_generator: gzip_bomb
- id: pcre2_url_matcher
  archetype: parser
  inline_sources:
    harness.c: "#define PCRE2_CODE_UNIT_WIDTH 8\n#include <pcre2.h>\n#include <stdio.h>\n\
      int main(void) {\n    char subj[256]; size_t n = fread(subj, 1, sizeof(subj)\
      \ - 1, stdin); subj[n] = '\\0';\n    int ec; PCRE2_SIZE eo;\n    pcre2_code\
      \ *re = pcre2_compile((PCRE2_SPTR)\"^https://([a-z]+)+\\\\.com$\", PCRE2_ZERO_TERMINATED,\
      \ 0, &ec, &eo, NULL);\n    pcre2_match_context *mc = pcre2_match_context_create(NULL);\n\
      \    pcre2_set_match_limit(mc, 100000000);\n    pcre2_match_data *md = pcre2_match_data_create_from_pattern(re,\
      \ NULL);\n    int rc = pcre2_match(re, (PCRE2_SPTR)subj, n, 0, 0, md, mc);\n\
      \    pcre2_match_context_free(mc); pcre2_match_data_free(md); pcre2_code_free(re);\n\
      \    printf(\"URL:%d\\n\", rc); return 0;\n}\n"
  ldflags:
