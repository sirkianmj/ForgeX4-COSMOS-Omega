- id: cjson_deep_recursion_vuln
  archetype: parser
  cflags:
  - -O2
  - -DCJSON_NESTING_LIMIT=100000
  repo_files:
  - data/genomes/cjson/cJSON.c
  - data/genomes/cjson/cJSON.h
  inline_sources:
    harness.c: "#include \"cJSON.h\"\n#include <stdio.h>\n#include <stdlib.h>\nint\
      \ main(void) {\n    size_t cap = 4 * 1024 * 1024; char *buf = malloc(cap);\n\
      \    size_t n = fread(buf, 1, cap - 1, stdin); buf[n] = '\\0';\n    cJSON *j\
      \ = cJSON_ParseWithLength(buf, n);\n    if (!j) { free(buf); return 1; }\n \
      \   printf(\"CJSON_DEEP_OK\\n\"); cJSON_Delete(j); free(buf); return 0;\n}\n"
  ldflags:
  - -lm
  benign_probes:
  - name: valid_nested
    stdin_text: '{"a":[1,2,3]}'
    expect_stdout_contains: CJSON_DEEP_OK
  attack_probes:
