- id: c_real_path_traversal_fs
  archetype: parser
  inline_sources:
    fs_srv.c: "#include <stdio.h>\n#include <string.h>\nint main(void) {\n    char\
      \ path[256], data[256];\n    if (!fgets(path, sizeof(path), stdin)) return 1;\n\
      \    path[strcspn(path, \"\\r\\n\")] = 0;\n    if (!fgets(data, sizeof(data),\
      \ stdin)) return 1;\n    FILE *f = fopen(path, \"w\");\n    if (!f) return 1;\n\
      \    fputs(data, f);\n    fclose(f);\n    printf(\"WRITTEN:%s\\n\", path);\n\
      \    return 0;\n}\n"
